[build]
  base = "frontend"
  # Netlify's build cache has served a stale/partial node_modules here more
  # than once (npm reported "up to date" against a half-restored cache,
  # silently missing the `vite` bin symlink — "vite: not found" at build
  # time despite the package being "installed"). rm -rf before each install
  # so we never trust a cached node_modules; always a full, clean install.
  # Also explicitly installs frontend's own deps (not just backend's) since
  # this site's automatic base-dir install has been unreliable too.
  command = "rm -rf node_modules && npm install && cd ../backend && rm -rf node_modules && npm install && cd ../frontend && npm run build"
  publish = "dist"

[functions]
  # Paths in this file resolve relative to [build.base] ("frontend"), and
  # our functions live at the repo root, not inside frontend/ — hence "../".
  directory = "../netlify/functions"

# Runs once a day (00:05 UTC) — generates this period's charges for active
# long-stay leases and flags overdue pending payments as late. Replaces the
# node-cron job used in local dev (see backend/src/cron.js).
[functions."scheduled-billing"]
  schedule = "5 0 * * *"

# IMPORTANT: order matters — Netlify uses the first matching redirect. The
# /api/* rule must come before the SPA catch-all, or API calls would be
# redirected to index.html instead of reaching the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
